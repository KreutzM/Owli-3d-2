name: Validate Owli project

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/project.py validate
      - run: python scripts/feathers_gate.py
      - run: python scripts/materials_gate.py
      - run: python scripts/eyes_gate.py
      - run: python -m compileall -q scripts
      - run: python -m unittest discover -s tests -v
